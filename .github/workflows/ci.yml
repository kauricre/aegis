name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7 build --with github.com/kauricre/aegis=.
      - run: for f in examples/*.caddyfile; do ./caddy validate --config "$f"; done
